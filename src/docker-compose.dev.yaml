name: gym_tracker_dev

services:
  db:
    image: mysql:8.0
    container_name: gym_tracker-db-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '${DB_PORT}:3306'

  app:
    container_name: gym_tracker-app-dev
    image: gym_tracker-app:custom 
    restart: always
    build: 
      context: ./express-server
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '${PORT}:8080'
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS} 
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      - db

volumes:
  mysql-data: