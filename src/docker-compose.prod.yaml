name: gym_tracker_prod

services:
  db:
    image: inf25dw2g01/gym_tracker_m1:db-0.2.0
    container_name: gym_tracker-db-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'

  app:
    image: inf25dw2g01/gym_tracker_m1:app-0.2.0
    container_name: gym_tracker-app-prod
    restart: always
    env_file:
      - .env
    ports:
      - '8080:8080'
    environment:
      DB_HOST: 'db'
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
    depends_on:
      - db

volumes:
  mysql-data: